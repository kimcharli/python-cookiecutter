<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ cookiecutter.project_name }} - {% raw %}{% block title %}{% endblock %}{% endraw %}</title>
    <script src="https://unpkg.com/htmx.org@2.1.2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: block; }
    </style>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <nav class="bg-slate-800 p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center">
                <span class="text-white font-bold text-xl tracking-tight">
                    {{ cookiecutter.project_name }}
                    <span class="text-blue-400">Dashboard</span>
                </span>
            </div>
            <div class="flex space-x-4">
                <a href="/" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">Dashboard</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto mt-8 p-4">
        {% raw %}{% block content %}{% endblock %}{% endraw %}
    </main>

    <footer class="container mx-auto mt-12 mb-8 text-center text-gray-500 text-sm">
        &copy; {{ cookiecutter.project_name }}
    </footer>
</body>
</html>
