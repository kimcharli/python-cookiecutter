[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.description }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
dependencies = [
{%- if cookiecutter.include_cli == "yes" %}
    "typer>=0.15.1",
    "shellingham>=1.5.4",
{%- endif %}
{%- if cookiecutter.include_web_dashboard == "yes" %}
    "aiofiles>=24.1.0",
    "fastapi>=0.115.6",
    "jinja2>=3.1.6",
    "uvicorn>=0.34.0",
{%- endif %}
    "pyyaml>=6.0.3",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.pkg_name }}"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mdformat>=0.7.21",
    "mdformat-frontmatter>=2.0.8",
    "mdformat-gfm>=0.1.13",
    "pre-commit>=4.1.0",
    "pytest>=8.3.3",
    "ruff>=0.9.4",
    "commitizen>=4.13.7",
]

{% if cookiecutter.include_cli == "yes" -%}
[project.scripts]
{{ cookiecutter.project_slug }} = "{{ cookiecutter.pkg_name }}.cli:main"
{%- endif %}

[tool.ruff]
line-length = 88
target-version = "py{{ cookiecutter.python_version | replace('.', '') }}"

[tool.ruff.lint]
select = ["E", "F", "I", "U", "N"]
ignore = []

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
