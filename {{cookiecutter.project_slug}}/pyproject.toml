[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.description }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
dependencies = [
{%- if cookiecutter.include_cli == "yes" %}
    "typer>=0.21.1",
    "shellingham>=1.5.4",
{%- endif %}
{%- if cookiecutter.include_web_dashboard == "yes" %}
    "aiofiles>=25.1.0",
    "fastapi>=0.128.0",
    "jinja2>=3.1.6",
    "uvicorn>=0.40.0",
{%- endif %}
    "pyyaml>=6.0.3",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.pkg_name }}"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mdformat>=1.0.0",
    "mdformat-frontmatter>=2.0.10",
    "mdformat-gfm>=1.0.0",
    "pre-commit>=4.5.1",
    "pymarkdownlnt>=0.9.35",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
]

{% if cookiecutter.include_cli == "yes" -%}
[project.scripts]
{{ cookiecutter.project_slug }} = "{{ cookiecutter.pkg_name }}.cli:main"
{%- endif %}

[tool.ruff]
line-length = 88
target-version = "py{{ cookiecutter.python_version | replace('.', '') }}"

[tool.ruff.lint]
select = ["E", "F", "I", "U", "N"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
